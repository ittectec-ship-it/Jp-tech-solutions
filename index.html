<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JP -Pilot | Black & Gold Edition</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            400: '#fbbf24',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                            metallic: '#d4af37'
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone for JSX -->
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
    </style>
</head>
<body class="bg-black text-white antialiased h-screen overflow-hidden flex flex-col">

    <div id="root" class="h-full w-full flex"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const PERSONAS = [
            { id: 'general', name: 'General Assistant', icon: '🤖', desc: 'Versatile problem solver for research, planning, & tasks.' },
            { id: 'writing', name: 'Writing & Docs', icon: '✍️', desc: 'Crafts professional emails, essays, and marketing copy.' },
            { id: 'code', name: 'Code & Dev', icon: '💻', desc: 'Expert programmer for debugging, architecture, & scripts.' },
            { id: 'data', name: 'Data & Strategy', icon: '📊', desc: 'Analyzes metrics, builds business frameworks, & models.' },
            { id: 'image', name: 'Image Creator', icon: '🎨', desc: 'Generates stunning photorealistic & artistic visuals.' },
            { id: 'teams', name: 'Teams Meeting Copilot', icon: '📞', desc: 'Auto-records, transcribes, & extracts action items from meetings.' }
        ];

        const ASPECT_RATIOS = [
            { id: '1:1', label: 'Square (1:1)', w: 1024, h: 1024 },
            { id: '16:9', label: 'Landscape (16:9)', w: 1280, h: 720 },
            { id: '9:16', label: 'Portrait (9:16)', w: 720, h: 1280 },
            { id: '4:3', label: 'Standard (4:3)', w: 1024, h: 768 }
        ];

        const STYLES = [
            { id: 'photorealistic', name: 'Photorealistic', suffix: 'highly detailed 8k photography, realistic lighting, professional DSLR' },
            { id: 'cinematic', name: 'Cinematic Studio', suffix: 'cinematic lighting, dramatic shadows, movie still, volumetric fog' },
            { id: 'architectural', name: 'Architectural', suffix: 'architectural render, clean lines, interior design, natural light' },
            { id: 'product', name: 'Product Shot', suffix: 'commercial studio lighting, minimalist background, product photography' },
            { id: 'digital', name: 'Digital Art', suffix: 'concept art, vibrant colors, trending on artstation, masterpiece' }
        ];

        function App() {
            const [sessions, setSessions] = useState(() => {
                const saved = localStorage.getItem('jp_pilot_gold_sessions_v3');
                return saved ? JSON.parse(saved) : [
                    { id: '1', title: 'Welcome to JP -Pilot', persona: 'general', messages: [
                        { role: 'assistant', content: 'Welcome to **JP -Pilot** (Black & Gold Edition). Equipped with Read, Write, Email, Image Generation, and Teams Meeting Copilot tools. How may I assist you today?' }
                    ], createdAt: Date.now() }
                ];
            });

            const [activeSessionId, setActiveSessionId] = useState(() => sessions[0]?.id || '1');
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [searchQuery, setSearchQuery] = useState('');
            
            // Image Studio Settings
            const [isImageMode, setIsImageMode] = useState(false);
            const [aspectRatio, setAspectRatio] = useState('1:1');
            const [selectedStyle, setSelectedStyle] = useState('photorealistic');
            const [magicEnhance, setMagicEnhance] = useState(true);

            // Teams Recorder State
            const [isTeamsRecording, setIsTeamsRecording] = useState(false);
            const [teamsMeetingUrl, setTeamsMeetingUrl] = useState('');
            const [recordingDuration, setRecordingDuration] = useState(0);

            // Canvas Studio State
            const [canvasOpen, setCanvasOpen] = useState(false);
            const [canvasContent, setCanvasContent] = useState('');
            const [canvasTitle, setCanvasTitle] = useState('');

            // Lightbox Modal State
            const [lightboxImg, setLightboxImg] = useState(null);

            const chatEndRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('jp_pilot_gold_sessions_v3', JSON.stringify(sessions));
            }, [sessions]);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [sessions, loading]);

            useEffect(() => {
                let timer;
                if (isTeamsRecording) {
                    timer = setInterval(() => setRecordingDuration(prev => prev + 1), 1000);
                } else {
                    setRecordingDuration(0);
                }
                return () => clearInterval(timer);
            }, [isTeamsRecording]);

            const currentSession = sessions.find(s => s.id === activeSessionId) || sessions[0];
            const currentPersona = PERSONAS.find(p => p.id === currentSession?.persona) || PERSONAS[0];

            const createNewSession = (personaId = 'general') => {
                const newId = Date.now().toString();
                const persona = PERSONAS.find(p => p.id === personaId) || PERSONAS[0];
                const newSession = {
                    id: newId,
                    title: `New ${persona.name} Chat`,
                    persona: personaId,
                    messages: [{ role: 'assistant', content: `Started new session in **${persona.name}** mode. What would you like to build, write, or analyze?` }],
                    createdAt: Date.now()
                };
                setSessions([newSession, ...sessions]);
                setActiveSessionId(newId);
                if (personaId === 'image') setIsImageMode(true);
            };

            const deleteSession = (e, id) => {
                e.stopPropagation();
                if (sessions.length <= 1) return;
                const filtered = sessions.filter(s => s.id !== id);
                setSessions(filtered);
                if (activeSessionId === id) setActiveSessionId(filtered[0].id);
            };

            // Read Aloud (TTS)
            const handleReadAloud = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const cleanText = text.replace(/###|\*\*|\[.*?\]/g, '');
                    const utterance = new SpeechSynthesisUtterance(cleanText);
                    window.speechSynthesis.speak(utterance);
                } else {
                    alert("Text-to-speech is not supported in your browser.");
                }
            };

            // Email Function
            const handleEmailSend = (title, content) => {
                const subject = encodeURIComponent(`JP -Pilot Report: ${title}`);
                const body = encodeURIComponent(content);
                window.location.href = `mailto:?subject=${subject}&body=${body}`;
            };

            // Quick Write Polish Actions
            const handleWriteAction = (actionType) => {
                if (!input.trim()) {
                    setInput("Please write a professional project summary regarding Q3 deliverables.");
                    return;
                }
                if (actionType === 'professional') {
                    setInput(`Rewrite the following text to sound highly professional and executive: "${input}"`);
                } else if (actionType === 'concise') {
                    setInput(`Condense the following text into concise bullet points: "${input}"`);
                } else if (actionType === 'email') {
                    setInput(`Draft a formal business email based on: "${input}"`);
                }
            };

            const handleSend = async (e) => {
                e.preventDefault();
                if (!input.trim() && !isTeamsRecording && loading) return;

                const userText = input.trim();
                setInput('');

                const isImgReq = isImageMode || currentSession.persona === 'image' || /^(create|generate|draw|render|photo|image of)\b/i.test(userText);
                const isTeamsReq = currentSession.persona === 'teams' || /teams|meeting|transcript|minutes/i.test(userText);

                const updatedMessages = [...currentSession.messages, { role: 'user', content: userText || "Analyze Teams Meeting Recording & Transcript" }];
                
                setSessions(sessions.map(s => s.id === currentSession.id ? {
                    ...s,
                    messages: updatedMessages,
                    title: s.messages.length === 1 ? (userText.slice(0, 30) || 'Teams Meeting') + '...' : s.title
                } : s));

                setLoading(true);

                setTimeout(() => {
                    let botReply = '';
                    let imageUrl = null;

                    if (isImgReq) {
                        const styleObj = STYLES.find(st => st.id === selectedStyle) || STYLES[0];
                        const ratioObj = ASPECT_RATIOS.find(ar => ar.id === aspectRatio) || ASPECT_RATIOS[0];
                        let finalPrompt = userText;
                        if (magicEnhance) {
                            finalPrompt = `${userText}, ${styleObj.suffix}, 8k resolution, photorealistic masterpiece`;
                        }
                        const encoded = encodeURIComponent(finalPrompt);
                        imageUrl = `https://image.pollinations.ai/prompt/${encoded}?width=${ratioObj.w}&height=${ratioObj.h}&seed=${Math.floor(Math.random() * 1000000)}&nologo=true`;
                        botReply = `Here is your generated image for: **"${userText}"**\n*Style: ${styleObj.name} (${ratioObj.label})*`;
                    } else if (isTeamsReq || currentSession.persona === 'teams') {
                        botReply = `### 📞 Microsoft Teams Meeting Minutes & Action Items\n\n**Meeting Topic:** Q3 Executive Strategy & Roadmap\n**Duration Recorded:** 28 minutes\n**Participants:** 8 attendees\n\n#### 🔑 Executive Summary\nThe executive committee reviewed strategic milestones, approved the Q3 budget allocations, and confirmed the new cloud architecture timeline.\n\n#### 📋 Key Decisions\n1. **Cloud Migration**: Approved move to AWS production cluster by September 15.\n2. **Security Compliance**: Mandated multi-factor authentication across all internal tooling.\n\n#### ✅ Action Items\n- [ ] **Sarah**: Finalize AWS cost projection and submit to VP *(Due: Aug 22)*\n- [ ] **Marcus**: Deploy security patch v3.1 to staging *(Due: Aug 19)*\n- [ ] **Elena**: Schedule follow-up design sprint *(Due: Aug 25)*`;
                    } else if (currentSession.persona === 'code') {
                        botReply = `Here is the optimized code solution:\n\n\`\`\`javascript\n// JP -Pilot Gold Module\nfunction executeWorkflow() {\n    console.log("Running high-performance routine...");\n    return true;\n}\nexecuteWorkflow();\n\`\`\`\nLet me know if you need unit tests or refactoring!`;
                    } else {
                        botReply = `I have processed your request regarding **"${userText}"**. Here are the primary recommendations:\n\n1. **Strategic Alignment**: Ensure clear KPIs are established.\n2. **Execution**: Deploy automated monitoring to maintain velocity.\n3. **Review**: Audit deliverables weekly.`;
                    }

                    const finalMessages = [...updatedMessages, { role: 'assistant', content: botReply, image: imageUrl }];

                    setSessions(sessions.map(s => s.id === currentSession.id ? {
                        ...s,
                        messages: finalMessages
                    } : s));
                    setLoading(false);
                }, 1200);
            };

            const formatTime = (secs) => {
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const openCanvas = (title, content) => {
                setCanvasTitle(title);
                setCanvasContent(content);
                setCanvasOpen(true);
            };

            const filteredSessions = sessions.filter(s => s.title.toLowerCase().includes(searchQuery.toLowerCase()));

            return (
                <div className="flex h-full w-full bg-black overflow-hidden text-white">
                    
                    {/* SIDEBAR */}
                    <aside className="w-72 bg-zinc-950 border-r border-zinc-800 flex flex-col justify-between shrink-0">
                        <div className="p-4 flex flex-col h-full overflow-hidden">
                            
                            {/* App Header */}
                            <div className="flex items-center justify-between mb-4 pb-3 border-b border-zinc-800">
                                <div className="flex items-center space-x-2">
                                    <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-400 to-amber-600 flex items-center justify-center font-bold text-black shadow-lg shadow-amber-500/20">JP</div>
                                    <span className="font-bold text-lg tracking-tight text-white">JP -Pilot</span>
                                </div>
                                <span className="text-[10px] bg-amber-500/10 text-amber-400 font-semibold px-2 py-0.5 rounded-full border border-amber-500/30">
